<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My landing page</title>
  <link rel="shortcut icon" href="data:image/x-icon;" type="image/x-icon">
  <!-- We need this line below for responsiveness! -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 1. Section Hero / Banner -->
  <div class="banner" style="background-image: linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1200&q=80');">
    <div class="banner-content">
      <h1>Donnez vie à vos projets digitaux</h1>
      <p>Une solution moderne, rapide et intuitive pour booster votre présence en ligne.</p>
      <a href="#how-it-works" class="btn-primary">Découvrir l'offre</a>
    </div>
  </div>

  <!-- 2. Section "How it works" -->
  <div id="how-it-works" class="container">
    <h2 class="text-center">Comment ça marche ?</h2>
    
    <div class="cards">
      <!-- Carte 1 -->
      <div class="card-category" style="background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=400&q=80');">
        <h3> Créez votre compte</h3>
      </div>
      <!-- Carte 2 -->
      <div class="card-category" style="background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=400&q=80');">
        <h3> Personnalisez</h3>
      </div>
      <!-- Carte 3 -->
      <div class="card-category" style="background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=400&q=80');">
        <h3>Lancez-vous</h3>
      </div>
    </div>
  </div>

  <!-- 3. Footer -->
  <div class="footer">
    <div class="footer-links">
      <a href="#" aria-label="Github"><i class="fab fa-github"></i></a>
      <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
      <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
      <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
    </div>
    <p>Ce site a été conçu avec ❤️ .</p>
  </div>

</body>
</html>
